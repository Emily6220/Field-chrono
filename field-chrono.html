<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Field Chrono</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Space+Grotesk:wght@400;500;600&display=swap');

  :root{
    --void:#FFFFFF;
    --panel:#F7F7F5;
    --bezel:#EBEBE8;
    --bezel-line:#D6D6D2;
    --ink:#0D0D0E;
    --ink-dim:#75746F;
    --accent:#0D0D0E;
    --accent-ink:#FFFFFF;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    background:var(--void);
    font-family:'Space Grotesk',-apple-system,sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }

  body{
    display:flex;
    justify-content:center;
    padding:28px 16px;
  }

  .wrap{
    width:100%;
    max-width:380px;
  }

  .eyebrow{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:11px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--ink-dim);
    margin-bottom:16px;
  }
  .eyebrow .dot{
    width:6px;height:6px;border-radius:50%;
    background:var(--bezel-line);
    transition:background .2s;
  }
  .eyebrow .dot.live{background:var(--accent);}

  .tabs{
    position:relative;
    display:flex;
    background:var(--panel);
    border:1px solid var(--bezel);
    border-radius:10px;
    padding:4px;
    margin-bottom:22px;
  }
  .tabs .highlight{
    position:absolute;
    top:4px;bottom:4px;
    width:calc(33.333% - 4px);
    background:var(--bezel);
    border-radius:7px;
    transition:transform .25s cubic-bezier(.4,0,.2,1);
    left:4px;
  }
  .tab{
    position:relative;
    flex:1;
    z-index:1;
    background:none;
    border:none;
    color:var(--ink-dim);
    font-family:'Space Grotesk',sans-serif;
    font-size:11px;
    font-weight:600;
    letter-spacing:0.06em;
    text-transform:uppercase;
    padding:10px 4px;
    cursor:pointer;
    border-radius:7px;
    transition:color .2s;
  }
  .tab.active{color:var(--ink);}
  .tab:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

  .dial-stage{
    position:relative;
    width:min(72vw,258px);
    aspect-ratio:1/1;
    margin:0 auto 18px;
  }
  .dial-stage svg{width:100%;height:100%;display:block;}

  .readout{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    pointer-events:none;
  }
  .readout .time{
    font-family:'Space Mono',monospace;
    font-weight:700;
    font-size:clamp(28px,7.5vw,34px);
    letter-spacing:0.01em;
    font-variant-numeric:tabular-nums;
  }
  .readout .time .cs{
    font-size:0.5em;
    color:var(--ink-dim);
  }
  .readout .sub{
    margin-top:6px;
    font-size:10px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--ink-dim);
    min-height:14px;
  }

  .stage.flash .readout .time{animation:flashBlink .3s ease-in-out 3;}
  @keyframes flashBlink{0%,100%{opacity:1;} 50%{opacity:0.15;}}

  .fields{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-bottom:20px;
    min-height:64px;
  }
  .field{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
  }
  .field label{
    font-size:10px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--ink-dim);
  }
  .field input{
    width:56px;
    padding:8px 4px;
    text-align:center;
    background:var(--panel);
    border:1px solid var(--bezel);
    border-radius:8px;
    color:var(--ink);
    font-family:'Space Mono',monospace;
    font-size:16px;
    font-weight:700;
    -moz-appearance:textfield;
  }
  .field input.wide{width:120px;}
  .field input::-webkit-outer-spin-button,
  .field input::-webkit-inner-spin-button{
    -webkit-appearance:none; margin:0;
  }
  .field input:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}
  .field .hint{
    font-size:10px;
    color:var(--ink-dim);
    min-height:12px;
  }

  .controls{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:16px;
  }
  .pusher{
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:12px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    border-radius:999px;
    cursor:pointer;
    transition:transform .1s, background .15s, border-color .15s;
  }
  .pusher:active{transform:scale(0.96);}
  .pusher:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .pusher.primary{
    padding:14px 34px;
    background:var(--accent);
    border:1px solid var(--accent);
    color:var(--accent-ink);
  }
  .pusher.primary.running{
    background:var(--panel);
    color:var(--accent);
    border-color:var(--accent);
  }
  .pusher.secondary{
    padding:14px 22px;
    background:transparent;
    border:1px solid var(--bezel-line);
    color:var(--ink-dim);
  }
  .pusher.secondary:disabled{
    opacity:0.4;
    cursor:not-allowed;
  }
  .pusher.secondary:not(:disabled):hover{
    color:var(--ink);
    border-color:var(--ink-dim);
  }

  @media (prefers-reduced-motion:reduce){
    .tabs .highlight, .pusher{transition:none;}
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="eyebrow"><span class="dot" id="liveDot"></span><span id="eyebrowText">Ready</span></div>

  <div class="tabs" role="tablist" aria-label="Timer mode">
    <div class="highlight" id="tabHighlight"></div>
    <button class="tab active" role="tab" aria-selected="true" data-mode="stopwatch">Stopwatch</button>
    <button class="tab" role="tab" aria-selected="false" data-mode="timer">Timer</button>
    <button class="tab" role="tab" aria-selected="false" data-mode="until">Countdown</button>
  </div>

  <div class="dial-stage" id="stage">
    <svg viewBox="0 0 300 300" aria-hidden="true">
      <g id="ticks"></g>
      <circle cx="150" cy="150" r="128" fill="none" stroke="var(--bezel)" stroke-width="10"/>
      <circle id="progressRing" cx="150" cy="150" r="128" fill="none" stroke="var(--accent)"
        stroke-width="10" stroke-linecap="round" transform="rotate(-90 150 150)"
        stroke-dasharray="804.2" stroke-dashoffset="804.2"/>
    </svg>
    <div class="readout">
      <div class="time" id="timeText">00:00:00</div>
      <div class="sub" id="subText"></div>
    </div>
  </div>

  <div class="fields" id="timerFields" style="display:none;">
    <div class="field">
      <input type="number" id="tH" min="0" max="99" value="00" inputmode="numeric">
      <label>Hrs</label>
    </div>
    <div class="field">
      <input type="number" id="tM" min="0" max="59" value="30" inputmode="numeric">
      <label>Min</label>
    </div>
    <div class="field">
      <input type="number" id="tS" min="0" max="59" value="00" inputmode="numeric">
      <label>Sec</label>
    </div>
  </div>

  <div class="fields" id="untilFields" style="display:none;">
    <div class="field">
      <input type="time" id="uTime" class="wide">
      <label id="uLabel">Target time</label>
      <span class="hint" id="uHint"></span>
    </div>
  </div>

  <div class="controls">
    <button class="pusher secondary" id="resetBtn" disabled>Reset</button>
    <button class="pusher primary" id="startBtn">Start</button>
  </div>
</div>

<script>
(function(){
  var CIRC = 2 * Math.PI * 128;
  var svgNS = "http://www.w3.org/2000/svg";

  var ticksG = document.getElementById('ticks');
  for (var i = 0; i < 60; i++) {
    var angle = (i / 60) * 2 * Math.PI - Math.PI / 2;
    var major = i % 5 === 0;
    var rOuter = 140;
    var rInner = major ? 130 : 135;
    var x1 = 150 + rInner * Math.cos(angle);
    var y1 = 150 + rInner * Math.sin(angle);
    var x2 = 150 + rOuter * Math.cos(angle);
    var y2 = 150 + rOuter * Math.sin(angle);
    var line = document.createElementNS(svgNS, 'line');
    line.setAttribute('x1', x1); line.setAttribute('y1', y1);
    line.setAttribute('x2', x2); line.setAttribute('y2', y2);
    line.setAttribute('stroke', major ? '#A6A5A0' : '#E4E3DF');
    line.setAttribute('stroke-width', major ? 2 : 1);
    ticksG.appendChild(line);
  }

  var tabs = document.querySelectorAll('.tab');
  var tabHighlight = document.getElementById('tabHighlight');
  var timerFields = document.getElementById('timerFields');
  var untilFields = document.getElementById('untilFields');
  var timeText = document.getElementById('timeText');
  var subText = document.getElementById('subText');
  var startBtn = document.getElementById('startBtn');
  var resetBtn = document.getElementById('resetBtn');
  var progressRing = document.getElementById('progressRing');
  var stage = document.getElementById('stage');
  var liveDot = document.getElementById('liveDot');
  var eyebrowText = document.getElementById('eyebrowText');
  var uTime = document.getElementById('uTime');
  var uHint = document.getElementById('uHint');

  var mode = 'stopwatch';
  var running = false;
  var elapsedMs = 0;
  var startedAt = 0;
  var targetMs = 0;
  var totalMs = 0;
  var tickHandle = null;
  var completed = false;

  var d = new Date();
  d.setMinutes(d.getMinutes() + 60);
  uTime.value = pad(d.getHours()) + ':' + pad(d.getMinutes());

  function pad(n){ return String(n).padStart(2,'0'); }

  function fmtHMS(ms, withCs){
    if (ms < 0) ms = 0;
    var totalCs = Math.floor(ms / 10);
    var cs = totalCs % 100;
    var totalSec = Math.floor(ms / 1000);
    var s = totalSec % 60;
    var m = Math.floor(totalSec / 60) % 60;
    var h = Math.floor(totalSec / 3600);
    var base = pad(h) + ':' + pad(m) + ':' + pad(s);
    if (withCs) return base + '<span class="cs">.' + pad(cs) + '</span>';
    return base;
  }

  function setRing(frac){
    frac = Math.max(0, Math.min(1, frac));
    progressRing.style.transition = running ? 'stroke-dashoffset .2s linear' : 'none';
    progressRing.setAttribute('stroke-dasharray', CIRC);
    progressRing.setAttribute('stroke-dashoffset', CIRC * (1 - frac));
  }

  function switchMode(newMode){
    if (running) stopTicking();
    mode = newMode;
    running = false;
    elapsedMs = 0;
    completed = false;
    stage.classList.remove('flash');
    startBtn.textContent = 'Start';
    startBtn.classList.remove('running');
    resetBtn.disabled = true;

    tabs.forEach(function(t){
      var active = t.dataset.mode === mode;
      t.classList.toggle('active', active);
      t.setAttribute('aria-selected', active);
    });
    var idx = Array.prototype.indexOf.call(tabs, document.querySelector('.tab[data-mode="'+mode+'"]'));
    tabHighlight.style.transform = 'translateX(' + (idx * 100) + '%)';

    timerFields.style.display = mode === 'timer' ? 'flex' : 'none';
    untilFields.style.display = mode === 'until' ? 'flex' : 'none';

    setRing(0);
    updateIdleDisplay();
    updateEyebrow();
  }

  function updateIdleDisplay(){
    if (mode === 'stopwatch'){
      timeText.innerHTML = fmtHMS(0, true);
      subText.textContent = 'Elapsed';
    } else if (mode === 'timer'){
      timeText.innerHTML = fmtHMS(readTimerTarget(), false);
      subText.textContent = 'Time remaining';
    } else {
      timeText.innerHTML = '00:00:00';
      subText.textContent = 'Time remaining';
    }
  }

  function updateEyebrow(){
    if (running){
      liveDot.classList.add('live');
      eyebrowText.textContent = mode === 'stopwatch' ? 'Running' : 'Counting down';
    } else if (completed){
      liveDot.classList.remove('live');
      eyebrowText.textContent = 'Complete';
    } else {
      liveDot.classList.remove('live');
      eyebrowText.textContent = 'Ready';
    }
  }

  function readTimerTarget(){
    var h = parseInt(document.getElementById('tH').value, 10) || 0;
    var m = parseInt(document.getElementById('tM').value, 10) || 0;
    var s = parseInt(document.getElementById('tS').value, 10) || 0;
    return (h * 3600 + m * 60 + s) * 1000;
  }

  function readUntilTarget(){
    var val = uTime.value;
    if (!val) return null;
    var parts = val.split(':');
    var now = new Date();
    var target = new Date();
    target.setHours(parseInt(parts[0],10), parseInt(parts[1],10), 0, 0);
    if (target.getTime() <= now.getTime()){
      target.setDate(target.getDate() + 1);
    }
    return target;
  }

  function updateUntilHint(){
    var t = readUntilTarget();
    if (!t){ uHint.textContent = ''; return; }
    var now = new Date();
    var sameDay = t.getDate() === now.getDate();
    var hour = t.getHours() % 12 || 12;
    var ampm = t.getHours() >= 12 ? 'PM' : 'AM';
    uHint.textContent = (sameDay ? 'Today' : 'Tomorrow') + ' at ' + hour + ':' + pad(t.getMinutes()) + ' ' + ampm;
  }
  uTime.addEventListener('input', updateUntilHint);
  updateUntilHint();

  ['tH','tM','tS'].forEach(function(id){
    document.getElementById(id).addEventListener('input', function(){
      if (mode === 'timer' && !running) updateIdleDisplay();
    });
  });

  function beep(){
    try{
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      var o = ctx.createOscillator();
      var g = ctx.createGain();
      o.type = 'sine';
      o.frequency.value = 880;
      g.gain.value = 0.15;
      o.connect(g); g.connect(ctx.destination);
      o.start();
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
      o.stop(ctx.currentTime + 0.4);
    }catch(e){}
  }

  function flashComplete(label){
    completed = true;
    running = false;
    stopTicking();
    stage.classList.add('flash');
    subText.textContent = label;
    startBtn.textContent = 'Start';
    startBtn.classList.remove('running');
    resetBtn.disabled = false;
    updateEyebrow();
    beep();
    setTimeout(function(){ stage.classList.remove('flash'); }, 900);
  }

  function tick(){
    var now = performance.now();
    var current = elapsedMs + (now - startedAt);

    if (mode === 'stopwatch'){
      timeText.innerHTML = fmtHMS(current, true);
      setRing((current % 60000) / 60000);
    } else if (mode === 'timer'){
      var timerRemaining = targetMs - current;
      if (timerRemaining <= 0){
        timeText.innerHTML = '00:00:00';
        setRing(1);
        flashComplete('Time up');
        return;
      }
      timeText.innerHTML = fmtHMS(timerRemaining, false);
      subText.textContent = 'Time remaining';
      setRing(current / targetMs);
    } else {
      var remaining = totalMs - current;
      if (remaining <= 0){
        timeText.innerHTML = '00:00:00';
        setRing(1);
        flashComplete('Time reached');
        return;
      }
      timeText.innerHTML = fmtHMS(remaining, false);
      setRing(current / totalMs);
    }
  }

  function startTicking(){
    tickHandle = setInterval(tick, 50);
  }
  function stopTicking(){
    if (tickHandle){ clearInterval(tickHandle); tickHandle = null; }
  }

  startBtn.addEventListener('click', function(){
    if (!running){
      if (completed){
        elapsedMs = 0;
        completed = false;
      }
      if (mode === 'timer'){
        targetMs = readTimerTarget();
        if (targetMs <= 0){
          subText.textContent = 'Set a target above 0';
          return;
        }
      } else if (mode === 'until'){
        var t = readUntilTarget();
        if (!t){
          subText.textContent = 'Pick a target time';
          return;
        }
        totalMs = t.getTime() - Date.now() + elapsedMs;
      }
      running = true;
      startedAt = performance.now();
      startBtn.textContent = 'Pause';
      startBtn.classList.add('running');
      resetBtn.disabled = false;
      updateEyebrow();
      startTicking();
    } else {
      running = false;
      elapsedMs += performance.now() - startedAt;
      stopTicking();
      startBtn.textContent = 'Resume';
      startBtn.classList.remove('running');
      updateEyebrow();
    }
  });

  resetBtn.addEventListener('click', function(){
    running = false;
    completed = false;
    elapsedMs = 0;
    stopTicking();
    stage.classList.remove('flash');
    startBtn.textContent = 'Start';
    startBtn.classList.remove('running');
    resetBtn.disabled = true;
    setRing(0);
    updateIdleDisplay();
    updateEyebrow();
  });

  tabs.forEach(function(t){
    t.addEventListener('click', function(){ switchMode(t.dataset.mode); });
  });

  switchMode('stopwatch');
})();
</script>

</body>
</html>
